# Shingan Workflow Regression Test Driven Bugfix

## Action

Follow the regression-test-driven-bugfix workflow:
1. Identify and fix the bug in the relevant implementation file(s).
2. Add or update a regression test in the corresponding *_test.go file to cover the bug scenario.
3. Update CHANGELOG.md to document the fix.
4. Update go.mod/go.sum if dependencies are added or changed.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: CHANGELOG.md, **/*.go, **/*_test.go

