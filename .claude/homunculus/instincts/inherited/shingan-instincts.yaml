# Shingan Workflow Feature Implementation With Cli And Infra

## Action

Follow the feature-implementation-with-cli-and-infra workflow:
1. Add or modify CLI command implementation and its tests
2. Add or modify domain logic and its tests
3. Add or modify infrastructure layer for persistence and its tests
4. Update or add documentation (docs/ and ADRs)
5. Update CHANGELOG.md

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: cli/*.go, cli/*_test.go, domain/*.go

