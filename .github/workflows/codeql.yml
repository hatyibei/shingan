name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# Read-only by default; the write scope CodeQL needs is granted on the job.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results
      contents: read
      actions: read # read workflow run info (needed on private repos)
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5.6.0
        with:
          go-version: "1.26.11"
          cache: true

      - uses: github/codeql-action/init@v3.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@v3.39.3

      - uses: github/codeql-action/analyze@v3.39.3
        continue-on-error: true  # Private repos require GitHub Advanced Security to upload SARIF; analysis still runs locally.
        with:
          category: "/language:${{ matrix.language }}"
          upload: failure-only
