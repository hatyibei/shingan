name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. Each job below is granted only the write scopes it
# actually needs (contents: write for the GitHub Release, id-token: write for
# npm provenance, packages: write for GHCR).
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets (via API)
    steps:
      # goreleaser only reads git locally (tags / log) and talks to GitHub via
      # the API with GITHUB_TOKEN below; it never pushes, so the checkout token
      # does not need to stay in .git/config.
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # No build cache for release builds: published binaries must not be
      # built from a cache another workflow run could have written.
      - uses: actions/setup-go@v5.6.0
        with:
          go-version: "1.26.10"
          cache: false

      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish shingan-lint to npm right after the GitHub Release + binaries
  # exist. Runs as a dependent job (not a separate `on: release` workflow)
  # because goreleaser creates the release with GITHUB_TOKEN, whose events do
  # not trigger other workflows — so the tag push alone now ships to npm.
  publish-npm:
    needs: goreleaser
    permissions:
      contents: read
      id-token: write # for npm --provenance in the called workflow
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ github.ref_name }}
    # Pass only the secret the called workflow declares, not every secret.
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Build + push the multi-arch container image to GHCR so the README's
  # `docker pull ghcr.io/hatyibei/shingan` actually resolves. Runs AFTER
  # goreleaser (not inside it) and in its own job so a Docker build/push failure
  # can never roll back the already-published binaries or the npm package.
  docker:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3.7.0
      - uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Inject the release version so `shingan version` in the image
          # matches the tag (issue #48). metadata-action strips the leading v.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
