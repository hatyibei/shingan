name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # for npm --provenance in the called publish-npm job

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish shingan-lint to npm right after the GitHub Release + binaries
  # exist. Runs as a dependent job (not a separate `on: release` workflow)
  # because goreleaser creates the release with GITHUB_TOKEN, whose events do
  # not trigger other workflows — so the tag push alone now ships to npm.
  publish-npm:
    needs: goreleaser
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
